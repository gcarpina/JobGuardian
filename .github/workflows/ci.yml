name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, test, and package consumer (.NET 8 and .NET 10)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: jobguardian
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d jobguardian"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      JOBGUARDIAN_POSTGRESQL_CONNECTION_STRING: "Host=localhost;Port=5432;Database=jobguardian;Username=postgres;Password=postgres"
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: jobguardian
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore dotnet/JobGuardian.sln

      - name: Build and test
        run: dotnet test dotnet/JobGuardian.sln --no-restore --configuration Release

      - name: Pack local NuGet packages
        run: |
          dotnet pack dotnet/JobGuardian.sln \
            --no-restore \
            --configuration Release \
            --output ./artifacts/packages

      - name: Restore package consumer sample
        run: |
          dotnet restore dotnet/samples/PackageConsumer/JobGuardian.PackageConsumer.csproj \
            --source ./artifacts/packages \
            --source https://api.nuget.org/v3/index.json \
            --packages ./artifacts/nuget-cache

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Apply packaged PostgreSQL schema
        run: |
          psql \
            -v ON_ERROR_STOP=1 \
            -f "$(find artifacts/nuget-cache/jobguardian.postgresql \
              -type f \
              -path '*/contentFiles/any/any/sql/postgresql/V001_initial_schema.sql' \
              -print -quit)"

      - name: Run package consumer sample (.NET 8)
        run: |
          dotnet run \
            --project dotnet/samples/PackageConsumer/JobGuardian.PackageConsumer.csproj \
            --framework net8.0 \
            --configuration Release \
            --no-restore

      - name: Run package consumer sample (.NET 10)
        run: |
          dotnet run \
            --project dotnet/samples/PackageConsumer/JobGuardian.PackageConsumer.csproj \
            --framework net10.0 \
            --configuration Release \
            --no-restore

      - name: Verify packaged PostgreSQL schema
        run: |
          cmp sql/postgresql/V001_initial_schema.sql \
            "$(find artifacts/nuget-cache/jobguardian.postgresql \
              -type f \
              -path '*/contentFiles/any/any/sql/postgresql/V001_initial_schema.sql' \
              -print -quit)"
